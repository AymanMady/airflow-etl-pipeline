# =============================================================================
#  Tests and documentation of the analytics layer
# =============================================================================
#  Testing the marts is not redundant with testing staging: the marts contain
#  JOINS and AGGREGATES, so bugs of a different nature - a join duplicating
#  rows, a forgotten GROUP BY, a division by zero.
# =============================================================================

version: 2

models:
  - name: fct_orders
    description: >
      Fact table: one row per order, enriched with the product and the
      customer. The grain is guaranteed by the uniqueness test on order_id.
    columns:
      - name: order_id
        description: Primary key. Must stay unique AFTER the joins.
        data_tests:
          - unique     # catches a join that would have duplicated rows
          - not_null
      - name: customer_id
        data_tests: [not_null]
      - name: product_id
        data_tests: [not_null]
      - name: quantity
        data_tests: [not_null, positive_values]
      - name: order_amount
        description: quantity * unit_price. NULL when the product cannot be found.
        data_tests:
          - non_negative_values
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: ['pending', 'paid', 'shipped', 'delivered', 'cancelled', 'returned']

  - name: dim_customers
    description: Customer dimension enriched with activity metrics.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: lifetime_value
        description: Revenue generated by the customer. Never negative, never NULL.
        data_tests: [not_null, non_negative_values]
      - name: orders_count
        data_tests: [not_null, non_negative_values]

  - name: dim_products
    description: Product dimension enriched with sales metrics.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: total_revenue
        data_tests: [not_null, non_negative_values]
      - name: price
        data_tests: [not_null, non_negative_values]

  - name: daily_sales
    description: >
      Daily sales aggregate. The reference table for tracking revenue.
    columns:
      - name: sales_date
        description: Sales day. Primary key of the aggregate.
        data_tests: [unique, not_null]
      - name: orders_count
        data_tests: [not_null, positive_values]
      - name: total_revenue
        data_tests: [not_null, non_negative_values]
      - name: average_order_value
        description: total_revenue / orders_count.
        data_tests: [not_null, non_negative_values]
